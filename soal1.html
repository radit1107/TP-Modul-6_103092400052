<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1 - JavaScript Prompt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
            border: 2px solid #bce8f1;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
            font-size: 16px;
            text-align: center;
            background: transparent;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="form-group">
            <label>Nama</label>
            <input type="text" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" id="nim" readonly>
        </div>
    </div>

    <script>
        // Meminta input Nama dan NIM menggunakan window.prompt saat halaman dibuka
        let namaUser = prompt("Masukkan nama kamu:");
        let nimUser = prompt("Masukkan nim kamu:");

        // Menampilkan hasil input ke dalam form jika pengguna mengisi
        document.getElementById("nama").value = namaUser ? namaUser : "";
        document.getElementById("nim").value = nimUser ? nimUser : "";
    </script>

</body>
</html>
